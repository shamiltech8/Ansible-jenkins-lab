
---
- name: Jenkins Ansible Integration Lab
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Confirm Ansible is running
      ansible.builtin.debug:
        msg: "Jenkins successfully invoked Ansible!"

    - name: Create a deployment test file
      ansible.builtin.copy:
        dest: /tmp/ansible-jenkins-lab.txt
        content: |
          Deployment completed successfully.
          Executed through Jenkins and Ansible.
        mode: "0644"

    - name: Verify the deployment test file
      ansible.builtin.command:
        cmd: cat /tmp/ansible-jenkins-lab.txt
      register: deployment_result
      changed_when: false

    - name: Display deployment result
      ansible.builtin.debug:
        var: deployment_result.stdout
